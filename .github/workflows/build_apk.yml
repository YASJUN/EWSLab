name: EWSLab verification

# Opt-in checks only. No automatic release, push, or repository write access.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
      - name: Install declared SDK packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Check core, generator, lint and APK
        run: |
          chmod +x gradlew
          ./gradlew :core:test :core:verifyGenerator :app:lintDebug :app:assembleDebug --console=plain
